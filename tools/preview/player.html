<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>/*__TITLE__*/</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: a wall of round device screens, each tappable through its faces; page chrome stays quiet. */
:root{
  --bg:#EEF0F4; --fg:#1A1F2B; --muted:#5E6676; --line:#D7DCE4; --chip:#E2E6EE; --warn:#B4540A;
  --screen:#0D1015; --screen-fg:#F2F3F7; --screen-muted:#8E95A6; --screen-soft:#B9B4F0; --ring:#5C63B8;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#12151B; --fg:#E8EBF0; --muted:#98A1B0; --line:#2A303B; --chip:#222833; --warn:#F0A04B; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#12151B; --fg:#E8EBF0; --muted:#98A1B0; --line:#2A303B; --chip:#222833; --warn:#F0A04B; color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1140px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:26px 56px}
header{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-family:var(--display);font-size:clamp(32px,6vw,56px);font-weight:800;letter-spacing:-.02em;line-height:1;text-wrap:balance}
.meta{margin:8px 0 0;color:var(--muted);font-size:15px}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{font:inherit;border:0;background:transparent;color:var(--muted);padding:7px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);font-weight:700}
.hint{margin:14px 0 22px;color:var(--muted);font-size:14px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 22px}
.item{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.dev{position:relative;width:100%;max-width:300px;aspect-ratio:1;border-radius:50%;background:var(--screen);container-type:inline-size;cursor:pointer;
  box-shadow:0 0 0 6px #22262E,0 10px 24px rgba(0,0,0,.18);transition:transform .14s ease-in;outline:none}
.dev:focus-visible{box-shadow:0 0 0 6px #22262E,0 0 0 9px var(--c)}
.dev.flipping{transform:scaleX(0)}
.ring{position:absolute;inset:0;width:100%;height:100%}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--screen-fg)}
.face[hidden]{display:none}
.de{font-family:var(--display)}
.kw{color:color-mix(in srgb,var(--c) 70%,white);font-weight:800;white-space:nowrap}
/* face 1 */
.disc{width:58cqw;height:58cqw;margin-top:10cqw;flex:none}
.lead{font-size:4cqw;color:var(--screen-muted);margin-top:1.6cqw;line-height:1.1;min-height:4.4cqw}
.head{font-size:9.5cqw;font-weight:800;letter-spacing:-.01em;line-height:1.05;color:color-mix(in srgb,var(--c) 70%,white);white-space:nowrap}
.gloss{font-size:4.4cqw;color:var(--screen-soft);margin-top:1cqw}
/* faces 2 and 3 */
.f2,.f3{justify-content:center;padding:0 13cqw;gap:3cqw}
.pill{display:inline-flex;align-items:center;gap:1.6cqw;background:var(--c);color:#fff;border-radius:99px;padding:.9cqw 3.2cqw;font-size:4.5cqw;font-weight:700;white-space:nowrap}
.chip{background:#fff;border-radius:99px;padding:.2cqw 1.6cqw;font-size:3.1cqw;font-weight:800}
.ex{font-size:5cqw;line-height:1.32;font-weight:500;white-space:pre-line}
.tr{font-size:3.8cqw;line-height:1.45;color:var(--screen-soft);white-space:pre-line}
.tiplabel{font-size:3.3cqw;color:var(--screen-muted);letter-spacing:.08em}
.tip{font-size:5cqw;line-height:1.38;font-weight:500}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--fg)}
.cap{font-size:13px;color:var(--muted);text-align:center;line-height:1.5;max-width:300px}
.cap code{font-size:12px}
.todo{color:var(--warn)}
footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;line-height:1.7}
footer code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:12.5px}
@media (prefers-reduced-motion: reduce){.dev{transition:none}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1 class="de" id="title"></h1>
      <p class="meta" id="meta"></p>
    </div>
    <div class="seg" role="group" aria-label="翻译语言" id="locales"></div>
  </header>
  <p class="hint">模拟设备圆屏：点一下屏幕翻面（正面 → 例句面 → 易错点面）。动画按设备的节奏循环；卡片下方标橙色的是固件还没实现、需要照这份预览移植的编号。</p>
  <main class="grid" id="grid"></main>
  <footer id="foot"></footer>
</div>

<script>
const DECK = /*__DECK__*/;
const THEME = /*__THEME__*/;
const REGISTRIES = /*__REGISTRY__*/;
const REGISTRY = REGISTRIES[DECK.character];
/*__CHARACTER__*/

const LOCALE_NAMES = { 'zh-Hans': '中文', 'en': 'English' };
let locale = DECK.locales[0];
try { const s = localStorage.getItem('preview-locale'); if (DECK.locales.includes(s)) locale = s; } catch (e) {}

const esc = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const strip = s => s.replace(/\{\{([^}|]*)(\|[a-z]+)?\}\}/g, '$1');
function markup(s) {
  return esc(s).replace(/\{\{([^}|]*)(?:\|([a-z]+))?\}\}/g, (m, text, role) => {
    if (role === 'prefix') return `<span style="color:${THEME.dark.prefix};font-weight:700">${text}</span>`;
    if (role === 'refl') return `<span style="color:${THEME.dark.refl};font-weight:700">${text}</span>`;
    if (role) return text;
    return `<span class="kw">${text}</span>`;
  });
}
/* same rules as tools/deckfmt.py: grammar_line() and face3_pattern() */
function grammarLine(c) {
  if (c.verb) {
    const aux = c.verb.perfekt.aux === 'sein' ? 'ist' : 'hat';
    return `${markup(c.verb.praeteritum)} · <span style="color:${THEME.dark.aux[c.verb.perfekt.aux]};font-weight:800">${aux}</span> ${markup(c.verb.perfekt.rest)}`;
  }
  if (c.noun) return c.noun.plural ? `die ${esc(c.noun.plural).replace(/\{\{([^}|]*)\|pl\}\}/g, (m, t) => `<span style="color:${THEME.dark.gender[c.noun.article]};font-weight:800;text-decoration:underline;text-underline-offset:3px">${t}</span>`)}` : null;
  if (c.pattern) return pill(c.pattern);
  return null;
}
const face3Pattern = c => (c.verb || c.noun) && c.pattern ? c.pattern : null;
function pill(p) {
  const chip = p.case ? `<span class="chip" style="color:${THEME.light.case[p.case]}">+ ${p.case}</span>` : '';
  return `<span class="pill">${esc(p.text)}${chip}</span>`;
}
function missing(c) {
  const a = c.anim || {}, out = [], REGISTRY = REGISTRIES[a.character || DECK.character];
  Object.keys(a.pose || {}).forEach(k => { if (!(k in REGISTRY.pose)) out.push('pose:' + k); });
  (a.motion || []).forEach(m => { if (!REGISTRY.motion.includes(m)) out.push('motion:' + m); });
  (a.fx || []).forEach(f => { if (!REGISTRY.fx.includes(f)) out.push('fx:' + f); });
  (a.props || []).forEach(x => { if (!(REGISTRY.prop || []).includes(x)) out.push('prop:' + x); });
  if (a.bubble && !REGISTRY.bubble.includes(a.bubble)) out.push('bubble:' + a.bubble);
  return out;
}

function ringSvg(index, total) {
  let s = '<svg class="ring" viewBox="0 0 100 100" aria-hidden="true">';
  const step = 360 / total, gap = Math.min(8, step * 0.3);
  for (let i = 0; i < total; i++) {
    const a0 = (-90 + i * step + gap / 2) * Math.PI / 180, a1 = (-90 + (i + 1) * step - gap / 2) * Math.PI / 180, r = 47;
    const x0 = 50 + r * Math.cos(a0), y0 = 50 + r * Math.sin(a0), x1 = 50 + r * Math.cos(a1), y1 = 50 + r * Math.sin(a1);
    const on = i === index;
    s += `<path d="M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" fill="none" stroke="${on ? 'var(--c)' : 'var(--ring)'}" stroke-width="${on ? 2.4 : 1.3}" stroke-linecap="round" opacity="${on ? 1 : 0.75}"/>`;
  }
  return s + '</svg>';
}

document.getElementById('title').textContent = DECK.title.de;
document.getElementById('meta').textContent = `${DECK.title[locale] || ''} · ${DECK.level} · 第 ${DECK.episode || '–'} 期 · ${DECK.cards.length} 张卡 · ${DECK.review?.status || 'draft'}`;

const seg = document.getElementById('locales');
DECK.locales.forEach(l => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = LOCALE_NAMES[l] || l; b.dataset.l = l;
  b.addEventListener('click', () => { locale = l; try { localStorage.setItem('preview-locale', l); } catch (e) {} renderText(); });
  seg.appendChild(b);
});

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const grid = document.getElementById('grid'), items = [];
DECK.cards.forEach((c, i) => {
  const item = document.createElement('div'); item.className = 'item';
  const dev = document.createElement('div'); dev.className = 'dev'; dev.tabIndex = 0; dev.setAttribute('role', 'button');
  dev.style.setProperty('--c', c.style.color);
  const headLen = (c.noun ? c.noun.article.length + 1 : 0) + strip(c.headword).length;
  const article = c.noun ? `<span style="color:${THEME.dark.gender[c.noun.article]}">${c.noun.article}</span> ` : '';
  dev.innerHTML = ringSvg(i, DECK.cards.length) + `
    <div class="face f1"><svg class="disc" viewBox="0 0 200 200" aria-hidden="true"></svg>
      <div class="lead de">${esc(c.lead || '')}</div><div class="head de" style="${headLen > 14 ? `font-size:${(9.5 * 14 / headLen).toFixed(2)}cqw` : ''}">${article}${markup(c.headword)}</div><div class="gloss"></div></div>
    <div class="face f2" hidden></div><div class="face f3" hidden></div>`;
  const faces = [1, 2].concat(c.tip || face3Pattern(c) ? [3] : []);
  const dots = document.createElement('div'); dots.className = 'dots'; dots.innerHTML = faces.map(() => '<i></i>').join('');
  const todo = missing(c);
  const cap = document.createElement('div'); cap.className = 'cap';
  cap.innerHTML = `<code>${c.id}</code>` + (todo.length ? `<br><span class="todo">待实现：${todo.join('，')}</span>` : '');
  item.append(dev, dots, cap); grid.appendChild(item);
  const scene = new Scene(dev.querySelector('.disc'), c);
  const it = { c, dev, dots, faces, face: 0, scene, start: performance.now() - i * 620, visible: true };
  items.push(it);
  const flip = () => {
    dev.classList.add('flipping');
    setTimeout(() => { it.face = (it.face + 1) % faces.length; showFace(it); dev.classList.remove('flipping'); }, RM ? 0 : 140);
  };
  dev.addEventListener('click', flip);
  dev.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
});

function showFace(it) {
  const n = it.faces[it.face];
  it.dev.querySelectorAll('.face').forEach((f, k) => f.hidden = k + 1 !== n);
  it.dots.querySelectorAll('i').forEach((d, k) => d.classList.toggle('on', k === it.face));
  it.dev.setAttribute('aria-label', `${strip(it.c.headword)}，第 ${it.face + 1} 面，共 ${it.faces.length} 面，点击翻面`);
}
function renderText() {
  seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === locale));
  items.forEach(it => {
    const c = it.c, g = grammarLine(c), p3 = face3Pattern(c);
    it.dev.querySelector('.gloss').textContent = c.gloss[locale] || '';
    it.dev.querySelector('.f2').innerHTML = (g ? `<div>${g}</div>` : '') +
      `<div class="ex de">${markup(c.example.de)}</div><div class="tr">${esc(c.example.translations[locale] || '')}</div>`;
    it.dev.querySelector('.f3').innerHTML = `<div class="tiplabel de">TIPP</div>` + (p3 ? `<div>${pill(p3)}</div>` : '') +
      (c.tip ? `<div class="tip de">${markup(c.tip[locale] || '')}</div>` : '');
    showFace(it);
  });
}
renderText();

const all = [...new Set(items.flatMap(it => missing(it.c)))].sort();
document.getElementById('foot').innerHTML = all.length
  ? `这一期需要固件新增 ${all.length} 个编号：${all.map(x => `<code>${x}</code>`).join(' ')}<br>画法见本页源码里的 <code>MOTION</code>、<code>FX</code>、<code>PROP</code>、<code>BUBBLE</code> 条目（与 <code>tools/preview/${DECK.character}.js</code> 相同）。`
  : '这一期用到的动画编号固件都已实现。';

if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(es => es.forEach(e => { const it = items.find(x => x.dev === e.target); if (it) it.visible = e.isIntersecting; }));
  items.forEach(it => io.observe(it.dev));
}
function frame(now) {
  items.forEach(it => {
    if (!it.visible || it.faces[it.face] !== 1) return;
    const t = RM ? B0 + 1 : ((now - it.start) / 1000) % DUR;
    it.scene.render(t, RM ? 0 : now / 1000);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
