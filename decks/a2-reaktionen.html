<style>
/* Layout: a wall of round device screens, each tappable through its faces; page chrome stays quiet. */
:root{
  --bg:#EEF0F4; --fg:#1A1F2B; --muted:#5E6676; --line:#D7DCE4; --chip:#E2E6EE; --warn:#B4540A;
  --screen:#0D1015; --screen-fg:#F2F3F7; --screen-muted:#8E95A6; --screen-soft:#B9B4F0; --ring:#5C63B8;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#12151B; --fg:#E8EBF0; --muted:#98A1B0; --line:#2A303B; --chip:#222833; --warn:#F0A04B; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#12151B; --fg:#E8EBF0; --muted:#98A1B0; --line:#2A303B; --chip:#222833; --warn:#F0A04B; color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1140px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:26px 56px}
header{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-family:var(--display);font-size:clamp(32px,6vw,56px);font-weight:800;letter-spacing:-.02em;line-height:1;text-wrap:balance}
.meta{margin:8px 0 0;color:var(--muted);font-size:15px}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{font:inherit;border:0;background:transparent;color:var(--muted);padding:7px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);font-weight:700}
.hint{margin:14px 0 22px;color:var(--muted);font-size:14px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 22px}
.item{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.dev{position:relative;width:100%;max-width:300px;aspect-ratio:1;border-radius:50%;background:var(--screen);container-type:inline-size;cursor:pointer;
  box-shadow:0 0 0 6px #22262E,0 10px 24px rgba(0,0,0,.18);transition:transform .14s ease-in;outline:none}
.dev:focus-visible{box-shadow:0 0 0 6px #22262E,0 0 0 9px var(--c)}
.dev.flipping{transform:scaleX(0)}
.ring{position:absolute;inset:0;width:100%;height:100%}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--screen-fg)}
.face[hidden]{display:none}
.de{font-family:var(--display)}
.kw{color:color-mix(in srgb,var(--c) 70%,white);font-weight:800;white-space:nowrap}
/* face 1 */
.disc{width:58cqw;height:58cqw;margin-top:10cqw;flex:none}
.lead{font-size:4cqw;color:var(--screen-muted);margin-top:1.6cqw;line-height:1.1;min-height:4.4cqw}
.head{font-size:9.5cqw;font-weight:800;letter-spacing:-.01em;line-height:1.05;color:color-mix(in srgb,var(--c) 70%,white);white-space:nowrap}
.gloss{font-size:4.4cqw;color:var(--screen-soft);margin-top:1cqw}
/* faces 2 and 3 */
.f2,.f3{justify-content:center;padding:0 13cqw;gap:3cqw}
.pill{display:inline-flex;align-items:center;gap:1.6cqw;background:var(--c);color:#fff;border-radius:99px;padding:.9cqw 3.2cqw;font-size:4.5cqw;font-weight:700;white-space:nowrap}
.chip{background:#fff;border-radius:99px;padding:.2cqw 1.6cqw;font-size:3.1cqw;font-weight:800}
.ex{font-size:5cqw;line-height:1.32;font-weight:500;white-space:pre-line}
.tr{font-size:3.8cqw;line-height:1.45;color:var(--screen-soft);white-space:pre-line}
.tiplabel{font-size:3.3cqw;color:var(--screen-muted);letter-spacing:.08em}
.tip{font-size:5cqw;line-height:1.38;font-weight:500}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--fg)}
.cap{font-size:13px;color:var(--muted);text-align:center;line-height:1.5;max-width:300px}
.cap code{font-size:12px}
.todo{color:var(--warn)}
footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;line-height:1.7}
footer code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:12.5px}
@media (prefers-reduced-motion: reduce){.dev{transition:none}}

function drawKn(R,p,col){
  R.g.setAttribute('transform',`translate(${p.x.toFixed(1)} ${(p.y-p.jump).toFixed(1)}) rotate(${p.rot.toFixed(2)}) scale(${p.sx.toFixed(3)} ${p.sy.toFixed(3)})`);
  R.body.setAttribute('fill',col);
  R.armL.setAttribute('transform',`translate(-31 -36) rotate(${p.armL.toFixed(1)})`);
  R.armR.setAttribute('transform',`translate(31 -36) rotate(${(-p.armR).toFixed(1)})`);
  const vis=1-Math.max(p.happy,p.shut), ry=4.6*p.open;
  R.eyes.forEach(e=>{
    e.ell.setAttribute('ry',ry.toFixed(2)); e.ell.setAttribute('cx',p.lookX.toFixed(2)); e.ell.setAttribute('cy',p.lookY.toFixed(2)); e.ell.setAttribute('opacity',vis.toFixed(2));
    e.hl.setAttribute('cx',(p.lookX+1.1).toFixed(2)); e.hl.setAttribute('cy',(p.lookY-ry*.35).toFixed(2)); e.hl.setAttribute('opacity',vis.toFixed(2));
    e.lid.setAttribute('y',(p.lookY-ry-.6).toFixed(2)); e.lid.setAttribute('height',(p.lid*ry*2+.6).toFixed(2)); e.lid.setAttribute('fill',col); e.lid.setAttribute('opacity',(p.lid>.02?vis:0).toFixed(2));
    e.happy.setAttribute('opacity',p.happy.toFixed(2)); e.shut.setAttribute('opacity',p.shut.toFixed(2));
  });
  const by=-14+p.browY, t=p.browT;
  R.browL.setAttribute('d',`M-15 ${(by+t*1.6).toFixed(1)} L-5 ${(by-t*3).toFixed(1)}`);
  R.browR.setAttribute('d',`M15 ${(by+t*1.6).toFixed(1)} L5 ${(by-t*3).toFixed(1)}`);
  const w=8*p.mw, c1=12+p.smile*7, c2=c1+p.mopen*11;
  R.mouth.setAttribute('d',`M${(-w).toFixed(1)} 12 Q0 ${c1.toFixed(1)} ${w.toFixed(1)} 12 Q0 ${c2.toFixed(1)} ${(-w).toFixed(1)} 12 Z`);
  R.mouth.setAttribute('opacity',(1-p.wob).toFixed(2));
  R.wob.setAttribute('d',`M${(-w).toFixed(1)} 12 l${(w/3).toFixed(1)} -2.4 l${(w/3).toFixed(1)} 2.4 l${(w/3).toFixed(1)} -2.4 l${(w/3).toFixed(1)} 2.4 l${(w/3).toFixed(1)} -2.4 l${(w/3).toFixed(1)} 2.4`);
  R.wob.setAttribute('opacity',p.wob.toFixed(2));
  R.blushL.setAttribute('opacity',(p.blush*.75).toFixed(2)); R.blushR.setAttribute('opacity',(p.blush*.75).toFixed(2));
}


/* Where effects attach: h.x / h.y = top of the head, h.my = mouth, h.by = body centre. */
function anchors(p) {
  const top = p.y - p.jump - 74 * p.sy;
  return { x: p.x, y: top, my: top + 44 * p.sy, by: p.y - p.jump - 37 * p.sy, sy: p.sy };
}

/* ---------- shapes reused by effects ---------- */
const STAR = 'M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6 Z';
const DROP = 'M0 -5 C2 -1 3 1 3 2.5 A3 3 0 1 1 -3 2.5 C-3 1 -2 -1 0 -5 Z';
const FONT = 'Bricolage Grotesque, system-ui, sans-serif';

/* sneeze timing, shared by motion "sneeze" and fx "sneeze" (2.8 s cycle) */
function sneezePhase(c) {
  const u = (c % 2.8) / 2.8;
  const build = u < 0.55 ? ease(u / 0.55) : u < 0.62 ? 1 : Math.max(0, 1 - (u - 0.62) / 0.25);
  const burst = u >= 0.55 && u < 0.85 ? (u - 0.55) / 0.3 : 0;
  return { build, burst };
}
/* yawn timing (3.4 s cycle, mouth open for the first 45 %) */
function yawnPhase(c) {
  const u = (c % 3.4) / 3.4;
  return u < 0.45 ? Math.sin(Math.PI * u / 0.45) : 0;
}

/* ---------- MOTION: (pose, clock, weight) -> mutates pose ---------- */
const MOTION = {
  'sway-slow': (p, c, w) => { p.rot += Math.sin(c * 1.2) * 1.5 * w; },
  'shiver':    (p, c, w) => { p.x += Math.sin(c * 45) * 1.1 * w; },
  'bounce':    (p, c, w) => { const s = Math.abs(Math.sin(c * 5)); p.jump += w * s * 9; p.sy *= 1 - 0.06 * w * (1 - s); p.sx *= 1 + 0.05 * w * (1 - s); },
  'breathe':   (p, c, w) => { const k = 1 + Math.sin(c * 1.8) * 0.015 * w; p.sx *= k; p.sy *= k; },
  'hop':       (p, c, w) => { p.jump += w * Math.max(0, Math.sin(c * 2.4)) * 3; },
  /* new in a2-gesundheit-zustaende */
  'yawn': (p, c, w) => {
    const e = yawnPhase(c) * w;
    p.mopen = Math.max(p.mopen, 1.15 * e); p.mw += (0.72 - p.mw) * e;
    p.shut = Math.max(p.shut, e); p.rot -= 3 * e; p.sy *= 1 + 0.04 * e;
  },
  'sneeze': (p, c, w) => {
    const { build, burst } = sneezePhase(c);
    p.rot += (-7 * build + (burst > 0 ? 16 * Math.sin(Math.PI * Math.min(1, burst * 2)) : 0)) * w;
    p.shut = Math.max(p.shut, Math.max(build, burst > 0 ? 1 : 0) * w);
    p.mopen = Math.max(p.mopen, (0.5 * build + (burst > 0 ? 0.4 : 0)) * w);
    p.jump += (burst > 0 ? 4 * Math.sin(Math.PI * Math.min(1, burst * 2)) : 0) * w;
  },
  'fan': (p, c, w) => { p.armR += Math.sin(c * 12) * 28 * w; p.rot += Math.sin(c * 12) * 1.2 * w; },
  /* from Ep.4 */
  'eye-dart':  (p, c, w) => { p.lookX += Math.sin(c * 2.6) * 2.6 * w; },
  'tremble':   (p, c, w) => { p.x += Math.sin(c * 30) * 0.7 * w; },
  'jump-wave': (p, c, w) => { const s = Math.abs(Math.sin(c * 7)); p.jump += w * s * 15; p.armL += Math.sin(c * 14) * 12 * w; p.armR += Math.sin(c * 14 + 1) * 12 * w; p.sy *= 1 - 0.07 * w * (1 - s); },
  /* new in a2-charakter */
  'type': (p, c, w) => { p.armL += Math.sin(c * 16) * 14 * w; p.armR += Math.sin(c * 16 + Math.PI) * 14 * w; p.jump += Math.abs(Math.sin(c * 16)) * 0.8 * w; p.lookY += 1.5 * w; },
  /* new in a2-reaktionen */
  'nod':   (p, c, w) => { const s = Math.max(0, Math.sin(c * 6)); p.sy *= 1 - 0.05 * s * w; p.lookY += 1.6 * s * w; p.browY += 1 * s * w; },
  'shrug': (p, c, w) => { const s = ease(clamp(Math.sin(c * 2.2) * 1.2)); p.armL += 30 * s * w; p.armR += 30 * s * w; p.sy *= 1 - 0.04 * s * w; p.browY -= 2 * s * w; },
  'wave':  (p, c, w) => { p.armR += Math.sin(c * 8) * 25 * w; p.rot += Math.sin(c * 8) * 1 * w; },
};

/* ---------- one card's animation, as the device plays it ---------- */
const DUR = 7.4, B0 = 2.8;            /* loop length, bubble appears at B0 */
const STAGE = { x: 90, y: 166 };       /* feet position on the 200 × 200 disc */
const SCALE = 1.16;                    /* character + effects, scaled around the feet */

class KnoedelScene {
  constructor(svg, card) {
    svg.innerHTML = '';
    this.card = card; this.anim = card.anim || {};
    const id = 'c' + Math.random().toString(36).slice(2, 8);
    const clip = el('clipPath', { id }, el('defs', {}, svg)); el('circle', { cx: 100, cy: 100, r: 100 }, clip);
    const root = el('g', { 'clip-path': `url(#${id})` }, svg);
    el('rect', { x: 0, y: 0, width: 200, height: 200, fill: card.style.background }, root);
    [[38, 46, 22], [168, 150, 32], [160, 30, 12]].forEach(([cx, cy, r]) => el('circle', { cx, cy, r, fill: '#FFFFFF', opacity: 0.35 }, root));
    const charG = el('g', { transform: `translate(${STAGE.x} ${STAGE.y}) scale(${SCALE}) translate(${-STAGE.x} ${-STAGE.y})` }, root);
    this.shadow = el('ellipse', { cx: STAGE.x, cy: STAGE.y + 1, rx: 30, ry: 4.5, fill: '#000', opacity: 0.08 }, charG);
    this.kn = makeKnoedel(charG);
    const fxg = el('g', {}, charG);
    this.fx = (this.anim.fx || []).map(f => FX[f] ? { def: FX[f], s: FX[f].make(fxg, card) } : null).filter(Boolean);
    this.missing = [...(this.anim.motion || []).filter(m => !MOTION[m]), ...(this.anim.fx || []).filter(f => !FX[f])];
    this.bub = el('g', { opacity: 0 }, root);
    if (this.anim.bubble && BUBBLE[this.anim.bubble]) {
      el('circle', { cx: 132, cy: 84, r: 3.5, fill: '#fff' }, this.bub); el('circle', { cx: 125, cy: 92, r: 2.2, fill: '#fff' }, this.bub);
      this.bubIn = el('g', {}, this.bub);
      el('rect', { x: -32, y: -27, width: 64, height: 52, rx: 16, fill: '#fff' }, this.bubIn);
      BUBBLE[this.anim.bubble](el('g', { transform: 'scale(0.85)' }, this.bubIn));
    }
    const target = Object.assign({}, N0, STAGE, this.anim.pose || {});
    const neutral = Object.assign({}, N0, STAGE);
    this.kf = [[0, neutral], [0.5, neutral], [1.1, target], [DUR - 0.6, target], [DUR, neutral]];
  }
  pose(t) {
    const kf = this.kf;
    for (let i = 0; i < kf.length - 1; i++) {
      const [t0, p0] = kf[i], [t1, p1] = kf[i + 1];
      if (t < t1) { const u = ease(clamp((t - t0) / (t1 - t0))), o = {}; for (const k in p0) o[k] = p0[k] + (p1[k] - p0[k]) * u; return o; }
    }
    return Object.assign({}, kf[kf.length - 1][1]);
  }
  render(t, c) {
    const p = this.pose(t);
    const w = clamp((t - 0.9) / 0.4) * clamp((DUR - 0.35 - t) / 0.45);
    (this.anim.motion || []).forEach(m => MOTION[m] && MOTION[m](p, c, w));
    const col = this.anim.tint && p.tint > 0 ? mixC(KN.base, this.anim.tint, p.tint * 0.6) : KN.base;
    drawKn(this.kn, p, col);
    this.shadow.setAttribute('cx', p.x.toFixed(1)); this.shadow.setAttribute('rx', (30 * p.sx - p.jump * 0.4).toFixed(1));
    const h = anchors(p);
    this.fx.forEach(f => f.def.tick(f.s, c, w, h));
    if (this.bubIn) {
      let b = clamp((t - B0 - 0.1) / 0.35) * clamp((DUR - 0.6 - t) / 0.3);
      this.bub.setAttribute('opacity', Math.min(1, b * 1.5).toFixed(2));
      this.bubIn.setAttribute('transform', `translate(160 ${(50 + Math.sin(c * 2) * 1.5).toFixed(1)}) scale(${Math.max(0.01, b < 1 ? backOut(b) : 1).toFixed(3)})`);
    }
  }
}

const esc = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const strip = s => s.replace(/\{\{([^}|]*)(\|[a-z]+)?\}\}/g, '$1');
function markup(s) {
  return esc(s).replace(/\{\{([^}|]*)(?:\|([a-z]+))?\}\}/g, (m, text, role) => {
    if (role === 'prefix') return `<span style="color:${THEME.dark.prefix};font-weight:700">${text}</span>`;
    if (role === 'refl') return `<span style="color:${THEME.dark.refl};font-weight:700">${text}</span>`;
    if (role) return text;
    return `<span class="kw">${text}</span>`;
  });
}
/* same rules as tools/deckfmt.py: grammar_line() and face3_pattern() */
function grammarLine(c) {
  if (c.verb) {
    const aux = c.verb.perfekt.aux === 'sein' ? 'ist' : 'hat';
    return `${markup(c.verb.praeteritum)} · <span style="color:${THEME.dark.aux[c.verb.perfekt.aux]};font-weight:800">${aux}</span> ${markup(c.verb.perfekt.rest)}`;
  }
  if (c.noun) return c.noun.plural ? `die ${esc(c.noun.plural).replace(/\{\{([^}|]*)\|pl\}\}/g, (m, t) => `<span style="color:${THEME.dark.gender[c.noun.article]};font-weight:800;text-decoration:underline;text-underline-offset:3px">${t}</span>`)}` : null;
  if (c.pattern) return pill(c.pattern);
  return null;
}
const face3Pattern = c => (c.verb || c.noun) && c.pattern ? c.pattern : null;
function pill(p) {
  const chip = p.case ? `<span class="chip" style="color:${THEME.light.case[p.case]}">+ ${p.case}</span>` : '';
  return `<span class="pill">${esc(p.text)}${chip}</span>`;
}
function missing(c) {
  const a = c.anim || {}, out = [], REGISTRY = REGISTRIES[a.character || DECK.character];
  Object.keys(a.pose || {}).forEach(k => { if (!(k in REGISTRY.pose)) out.push('pose:' + k); });
  (a.motion || []).forEach(m => { if (!REGISTRY.motion.includes(m)) out.push('motion:' + m); });
  (a.fx || []).forEach(f => { if (!REGISTRY.fx.includes(f)) out.push('fx:' + f); });
  (a.props || []).forEach(x => { if (!(REGISTRY.prop || []).includes(x)) out.push('prop:' + x); });
  if (a.bubble && !REGISTRY.bubble.includes(a.bubble)) out.push('bubble:' + a.bubble);
  return out;
}

    s += `<path d="M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" fill="none" stroke="${on ? 'var(--c)' : 'var(--ring)'}" stroke-width="${on ? 2.4 : 1.3}" stroke-linecap="round" opacity="${on ? 1 : 0.75}"/>`;
  }
  return s + '</svg>';
}

document.getElementById('title').textContent = DECK.title.de;
document.getElementById('meta').textContent = SHOWCASE
  ? `${DECK.title.en || ''} · ${DECK.level.replace('-', '–')} · ${DECK.cards.length} cards · Knödel Watch`
  : `${DECK.title[locale] || ''} · ${DECK.level} · 第 ${DECK.episode || '–'} 期 · ${DECK.cards.length} 张卡 · ${DECK.review?.status || 'draft'}`;
if (SHOWCASE) {
  document.documentElement.lang = 'en';
  document.getElementById('locales').setAttribute('aria-label', 'Translation');
  document.getElementById('hint').textContent = 'Every round screen is one card as it plays on the watch. Click a card to turn it: the word, then an example, then a tip.';
}

const seg = document.getElementById('locales');
DECK.locales.forEach(l => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = LOCALE_NAMES[l] || l; b.dataset.l = l;
  b.addEventListener('click', () => { locale = l; try { localStorage.setItem('preview-locale', l); } catch (e) {} renderText(); });
  seg.appendChild(b);
});

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const grid = document.getElementById('grid'), items = [];
DECK.cards.forEach((c, i) => {
  const item = document.createElement('div'); item.className = 'item';
  const dev = document.createElement('div'); dev.className = 'dev'; dev.tabIndex = 0; dev.setAttribute('role', 'button');
  dev.style.setProperty('--c', c.style.color);
  const headLen = (c.noun ? c.noun.article.length + 1 : 0) + strip(c.headword).length;
  const article = c.noun ? `<span style="color:${THEME.dark.gender[c.noun.article]}">${c.noun.article}</span> ` : '';
  dev.innerHTML = ringSvg(i, DECK.cards.length) + `
    <div class="face f1"><svg class="disc" viewBox="0 0 200 200" aria-hidden="true"></svg>
      <div class="lead de">${esc(c.lead || '')}</div><div class="head de" style="${headLen > 14 ? `font-size:${(9.5 * 14 / headLen).toFixed(2)}cqw` : ''}">${article}${markup(c.headword)}</div><div class="gloss"></div></div>
    <div class="face f2" hidden></div><div class="face f3" hidden></div>`;
  const faces = [1, 2].concat(c.tip || face3Pattern(c) ? [3] : []);
  const dots = document.createElement('div'); dots.className = 'dots'; dots.innerHTML = faces.map(() => '<i></i>').join('');
  const todo = missing(c);
  const cap = document.createElement('div'); cap.className = 'cap';
  cap.innerHTML = `<code>${c.id}</code>` + (todo.length ? `<br><span class="todo">待实现：${todo.join('，')}</span>` : '');
  item.append(dev, dots);
  if (!SHOWCASE) item.append(cap);
  grid.appendChild(item);
  const scene = new Scene(dev.querySelector('.disc'), c);
  const it = { c, dev, dots, faces, face: 0, scene, start: performance.now() - i * 620, visible: true };
  items.push(it);
  const flip = () => {
    dev.classList.add('flipping');
    setTimeout(() => { it.face = (it.face + 1) % faces.length; showFace(it); dev.classList.remove('flipping'); }, RM ? 0 : 140);
  };
  dev.addEventListener('click', flip);
  dev.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
});

function showFace(it) {
  const n = it.faces[it.face];
  it.dev.querySelectorAll('.face').forEach((f, k) => f.hidden = k + 1 !== n);
  it.dots.querySelectorAll('i').forEach((d, k) => d.classList.toggle('on', k === it.face));
  it.dev.setAttribute('aria-label', SHOWCASE ? `${strip(it.c.headword)}, side ${it.face + 1} of ${it.faces.length}, click to turn`
    : `${strip(it.c.headword)}，第 ${it.face + 1} 面，共 ${it.faces.length} 面，点击翻面`);
}
function renderText() {
  seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === locale));
  items.forEach(it => {
    const c = it.c, g = grammarLine(c), p3 = face3Pattern(c);
    it.dev.querySelector('.gloss').textContent = c.gloss[locale] || '';
    it.dev.querySelector('.f2').innerHTML = (g ? `<div>${g}</div>` : '') +
      `<div class="ex de">${markup(c.example.de)}</div><div class="tr">${esc(c.example.translations[locale] || '')}</div>`;
    it.dev.querySelector('.f3').innerHTML = `<div class="tiplabel de">TIPP</div>` + (p3 ? `<div>${pill(p3)}</div>` : '') +
      (c.tip ? `<div class="tip de">${markup(c.tip[locale] || '')}</div>` : '');
    showFace(it);
  });
}
renderText();

const all = [...new Set(items.flatMap(it => missing(it.c)))].sort();
document.getElementById('foot').innerHTML = SHOWCASE
  ? '<a href="index.html" style="color:inherit">← All decks</a> · Knödel Watch: open-source German flashcards for ESP32 watches · <a href="https://github.com/yanxuceo/knoedel-watch" style="color:inherit">github.com/yanxuceo/knoedel-watch</a>'
  : all.length
  ? `这一期需要固件新增 ${all.length} 个编号：${all.map(x => `<code>${x}</code>`).join(' ')}<br>画法见本页源码里的 <code>MOTION</code>、<code>FX</code>、<code>PROP</code>、<code>BUBBLE</code> 条目（与 <code>tools/preview/${DECK.character}.js</code> 相同）。`
  : '这一期用到的动画编号固件都已实现。';

if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(es => es.forEach(e => { const it = items.find(x => x.dev === e.target); if (it) it.visible = e.isIntersecting; }));
  items.forEach(it => io.observe(it.dev));
}
function frame(now) {
  items.forEach(it => {
    if (!it.visible || it.faces[it.face] !== 1) return;
    const t = RM ? B0 + 1 : ((now - it.start) / 1000) % DUR;
    it.scene.render(t, RM ? 0 : now / 1000);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
